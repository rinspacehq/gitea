name: rinspace-fork-checks

on:
  pull_request:
    branches:
      - "rinspace-*"
  push:
    branches:
      - "rinspace-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused_go_checks:
    name: ${{ matrix.name }}
    if: github.repository == 'rinspacehq/gitea'
    # Never send external fork code to the trusted Rinspace runner pool.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'rinspace-gitea-checks' }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: "1"
      GOMEMLIMIT: 2GiB
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Rinspace formatting
            command: |
              git diff --check
              git ls-files -z '*.go' | xargs -0 gofmt -l > /tmp/unformatted-go
              test ! -s /tmp/unformatted-go || { cat /tmp/unformatted-go; exit 1; }
          - name: Rinspace models and control
            command: go test -p 1 -vet=off ./models/rinauth ./models/rincontrol ./services/rincontrol
          - name: Authentication behavior
            command: go test -p 1 -vet=off ./services/auth
          - name: Repository behavior
            command: go test -p 1 -vet=off ./services/repository -run 'Rinspace|Publication'
          - name: Editor catalog behavior
            command: |
              go test -p 1 ./models/db -run '^TestRinspaceCatalogPostgresIndexMetadata$'
              go test -p 1 ./modules/rinspacecatalog
              go test -p 1 -tags sqlite,sqlite_unlock_notify ./models/repo -run '^TestRinspaceEditorProject(SQLIsBounded|Options)$'
              go test -p 1 -tags sqlite,sqlite_unlock_notify ./routers/api/v1/user -run '^TestRinspaceEditorCatalog'
              go test -c -p 1 -tags sqlite,sqlite_unlock_notify,rinspace_catalog_postgres -o /tmp/editor-catalog-postgres.test ./models/repo
              go test -c -p 1 -tags sqlite,sqlite_unlock_notify,rinspace_catalog_postgres -o /tmp/editor-catalog-api.test ./tests/integration
          - name: Migration compile
            command: go test -c -o /dev/null ./models/migrations/v1_27
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Run ${{ matrix.name }}
        shell: bash
        run: ${{ matrix.command }}

  focused-go:
    name: focused-go
    if: ${{ always() && github.repository == 'rinspacehq/gitea' }}
    needs: [focused_go_checks]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'rinspace-gitea-checks' }}
    timeout-minutes: 2
    steps:
      - name: Require every named Go check
        env:
          CHECKS_RESULT: ${{ needs.focused_go_checks.result }}
        run: |
          if [ "${CHECKS_RESULT}" != 'success' ]; then
            echo '::error title=Rinspace Go checks failed::Open the named failed check above for its focused log.'
            exit 1
          fi
          echo 'All Rinspace Go checks passed.'

  dockerfile-check:
    if: github.repository == 'rinspacehq/gitea'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'rinspace-gitea-checks' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Require dedicated Docker engine on self-hosted runners
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          test "${DOCKER_HOST:-}" = unix:///work/buildkit/docker.sock
          test -S /work/buildkit/docker.sock
          test ! -e /var/run/docker.sock
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Validate rootful Dockerfile
        run: docker buildx build --check --platform linux/amd64 .
      - name: Validate rootless Dockerfile
        run: docker buildx build --check --platform linux/amd64 --file Dockerfile.rootless .
